image: ubuntu:24.04

stages:
  - deploy
  - verify

deploy:
  stage: deploy

  tags:
    - deployment

  before_script:
    - apt update
    - apt install -y openssh-client curl
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts

  script:
  - |
    ssh $DEPLOY_USER@$DEPLOY_HOST "
      cd $DEPLOY_PATH &&
      git pull &&
      docker build -t api-health-check . &&
      docker stop api-health-check || true &&
      docker rm api-health-check || true &&
      docker run -d \
        --name api-health-check \
        -p 5000:5000 \
        --restart unless-stopped \
        api-health-check
    "

verify:
  stage: verify

  tags:
    - deployment

  before_script:
    - apt update
    - apt install -y curl

  script:
    - sleep 10
    - curl --fail http://$DEPLOY_HOST:5000/health