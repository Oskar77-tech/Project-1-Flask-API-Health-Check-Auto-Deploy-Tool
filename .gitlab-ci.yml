image: ubuntu:24.04

stages:
  - test

test:
  stage: test
  tags:
    - wireguard

  before_script:
    - apt update
    - apt install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ls -la ~/.ssh

  script:
    - ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null oskar@10.10.0.5 hostname